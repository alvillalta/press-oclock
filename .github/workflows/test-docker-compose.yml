name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMAIN: localhost
      STACK_NAME: press-oclock-ci
      DOCKER_IMAGE_BACKEND: backend
      DOCKER_IMAGE_FRONTEND: frontend
      ENVIRONMENT: local
      PROJECT_NAME: "Press O'Clock"
      FRONTEND_HOST: http://localhost:5173
      BACKEND_CORS_ORIGINS: http://localhost
      SECRET_KEY: test_secret_key_for_ci
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: test_superuser_password
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MAKE_API_KEY: test_make_api_key
      OPENAI_API_KEY: test_openai_api_key
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1536"
      GENERATION_MODEL: gpt-4o-mini
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create .env file
        run: |
          cat > .env <<EOF
          DOMAIN=${DOMAIN}
          STACK_NAME=${STACK_NAME}
          DOCKER_IMAGE_BACKEND=${DOCKER_IMAGE_BACKEND}
          DOCKER_IMAGE_FRONTEND=${DOCKER_IMAGE_FRONTEND}
          ENVIRONMENT=${ENVIRONMENT}
          PROJECT_NAME="${PROJECT_NAME}"
          FRONTEND_HOST=${FRONTEND_HOST}
          BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
          SECRET_KEY=${SECRET_KEY}
          FIRST_SUPERUSER=${FIRST_SUPERUSER}
          FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
          POSTGRES_SERVER=${POSTGRES_SERVER}
          POSTGRES_PORT=${POSTGRES_PORT}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          MAKE_API_KEY=${MAKE_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          EMBEDDING_MODEL=${EMBEDDING_MODEL}
          EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
          GENERATION_MODEL=${GENERATION_MODEL}
          EOF
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:5173
      - run: docker compose down -v --remove-orphans
